
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Reset Password - E-JoseLib</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style-mobile.css') }}"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <style>
      /* RESET PASSWORD FLASH MESSAGES */
      .flash-messages {
        width: 100%;
        margin: 0 0 18px;
      }

      .flash-message {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 12px 14px;
        border-radius: 10px;
        margin-bottom: 10px;
        font-size: 14px;
        line-height: 1.5;
        overflow-wrap: anywhere;
      }

      .flash-message i {
        margin-top: 3px;
        flex-shrink: 0;
      }

      .flash-success {
        color: #166534;
        background: #dcfce7;
        border: 1px solid #86efac;
      }

      .flash-error,
      .flash-danger {
        color: #991b1b;
        background: #fee2e2;
        border: 1px solid #fca5a5;
      }

      .flash-warning {
        color: #92400e;
        background: #fef3c7;
        border: 1px solid #fcd34d;
      }

      .flash-info {
        color: #1e40af;
        background: #dbeafe;
        border: 1px solid #93c5fd;
      }
    </style>
  </head>

  <body>
    <div class="login-card">

      <div class="login-logo">
        <img
          src="{{ url_for('static', filename='SJC_LOGO.png') }}"
          alt="School Logo"
        />
      </div>

      <h2>Reset Password</h2>

      <p class="subtitle">
        Create a new password for your E-JoseLib account.
      </p>

      <!-- FLASH MESSAGES -->
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="flash-messages">
            {% for category, message in messages %}
              <div class="flash-message flash-{{ category }}" role="alert">
                <i class="fa-solid
                  {% if category == 'success' %}
                    fa-circle-check
                  {% elif category == 'error' or category == 'danger' %}
                    fa-circle-exclamation
                  {% else %}
                    fa-circle-info
                  {% endif %}
                "></i>

                <span>{{ message }}</span>
              </div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <form method="POST">

        <!-- ERROR ABOVE INPUT GROUP -->
        {% if error %}
          <p class="error" role="alert">{{ error }}</p>
        {% endif %}

        <div class="input-group">
          <label>New Password</label>

          <div class="input-box">
            <i class="fa-solid fa-lock"></i>

            <input
              type="password"
              id="newPassword"
              name="password"
              placeholder="Enter new password"
              required
            />

            <i
              class="fa-solid fa-eye toggle-password"
              id="toggleNewPassword"
            ></i>
          </div>
        </div>

        <div class="input-group">
          <label>Confirm Password</label>

          <div class="input-box">
            <i class="fa-solid fa-lock"></i>

            <input
              type="password"
              id="confirmPassword"
              name="confirm_password"
              placeholder="Confirm new password"
              required
            />

            <i
              class="fa-solid fa-eye toggle-password"
              id="toggleConfirmPassword"
            ></i>
          </div>
        </div>

        <button type="submit">Reset Password</button>
      </form>

    </div>

    <script>
      function setupPasswordToggle(inputId, toggleId) {
        const input = document.getElementById(inputId);
        const toggle = document.getElementById(toggleId);

        if (!input || !toggle) return;

        toggle.addEventListener("click", function () {
          if (input.type === "password") {
            input.type = "text";
            toggle.classList.remove("fa-eye");
            toggle.classList.add("fa-eye-slash");
          } else {
            input.type = "password";
            toggle.classList.remove("fa-eye-slash");
            toggle.classList.add("fa-eye");
          }
        });
      }

      setupPasswordToggle("newPassword", "toggleNewPassword");
      setupPasswordToggle("confirmPassword", "toggleConfirmPassword");
    </script>
  </body>
</html>
